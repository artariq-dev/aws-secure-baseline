name: Terraform Plan

on:
  pull_request:
    paths:
      - 'accounts/**'
      - 'global/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed environments
        id: set-matrix
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^(accounts|global)/' \
            | awk -F'/' 'NF>=3{print $1"/"$2"/"$3}' \
            | sort -u)

          if [ -z "$CHANGED" ]; then
            echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
            exit 0
          fi

          MATRIX=$(echo "$CHANGED" | jq -R -s -c \
            'split("\n") | map(select(length > 0)) | map({path: .})')
          echo "matrix={\"include\":$MATRIX}" >> $GITHUB_OUTPUT

  plan:
    needs: detect-changes
    if: ${{ fromJson(needs.detect-changes.outputs.matrix).include != null }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Select AWS role
        id: role
        run: |
          if echo "${{ matrix.path }}" | grep -qE "^accounts/prod|^global"; then
            echo "arn=${{ secrets.PROD_ROLE_ARN }}" >> $GITHUB_OUTPUT
          else
            echo "arn=${{ secrets.NON_PROD_ROLE_ARN }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: us-east-1

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ${{ matrix.path }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ matrix.path }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ matrix.path }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -var-file=terraform.tfvars -no-color -out=tfplan \
            2>&1 | tee plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        working-directory: ${{ matrix.path }}
        continue-on-error: true

      - name: Post Plan as PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('${{ matrix.path }}/plan-output.txt', 'utf8');
            const body = raw.length > 60000
              ? raw.slice(0, 60000) + '\n\n... truncated — see workflow logs'
              : raw;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Plan: \`${{ matrix.path }}\`\n\n<details><summary>Show Output</summary>\n\n\`\`\`\n${body}\n\`\`\`\n\n</details>`
            });

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        run: exit 1
